on:
  pull_request:

name: ci
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npm test

  test-bun-adapter:
    name: test-bun-adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - run: bun test packages/framework/src/fetch-handler.test.ts
